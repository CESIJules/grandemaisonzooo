<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lentille Spectrale — Artwork Vivant (B)</title>
  <link rel="stylesheet" href="/testthings/css/style.css">
  <script src="/testthings/js/vision-core.js"></script>
  <style>
    /* Calque secret qui remplace l'artwork en 1:1 */
    #artReplacementLayer {
      position: absolute;
      top: 0;
      left: 0;
      width: 540px;
      height: 380px;
      transform-origin: 0 0;
      pointer-events: none;
      z-index: 25;
      display: none;
      will-change: transform;
      background: #000;
      border: 4px solid #00aaff;
      box-shadow: 0 0 50px rgba(0, 170, 255, 0.8);
      overflow: hidden;
    }

    .art-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: contrast(1.4) brightness(0.6) hue-rotate(180deg);
      opacity: 0.85;
    }

    .art-secret-content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
      background: radial-gradient(circle, rgba(0, 170, 255, 0.2) 0%, rgba(0,0,0,0.7) 80%);
      color: #fff;
    }

    .spectral-runes {
      font-size: 2rem;
      letter-spacing: 0.3em;
      color: #00aaff;
      text-shadow: 0 0 15px #00aaff;
      margin-bottom: 0.5rem;
      animation: pulseRune 2s infinite alternate;
    }

    @keyframes pulseRune {
      0% { opacity: 0.6; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1.02); }
    }
  </style>
</head>
<body style="background: #000; overflow: hidden; position: fixed; inset: 0;">

  <div class="ar-viewport">
    
    <video id="cameraFeed" autoplay playsinline muted></video>

    <canvas id="reticleCanvas" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 15;"></canvas>

    <!-- Calque de remplacement de l'Artwork en 1:1 -->
    <div id="artReplacementLayer">
      <img src="/room45/cover/a01.png" alt="" class="art-bg">
      <div class="art-secret-content">
        <div class="spectral-runes">𐘀 𐘁 𐘂 𐘃</div>
        <div style="font-size: 0.7rem; letter-spacing: 0.25em; text-transform: uppercase; color: #00aaff; margin-bottom: 0.4rem;">
          • SCEAU DÉVERROUILLÉ •
        </div>
        <div id="artSecretCodeDisplay" style="font-size: 1.8rem; font-weight: 900; letter-spacing: 0.15em; color: #ffffff; text-shadow: 0 0 20px #00aaff; border-bottom: 2px solid #00aaff; padding-bottom: 0.4rem;">
          RÉPONSE : OUVERTURE
        </div>
        <p style="font-size: 0.78rem; color: #ddd; margin-top: 0.8rem; line-height: 1.4;">
          « L'image cachait la clé depuis le début. »
        </p>
      </div>
    </div>

    <!-- Barre d'outils haut d'écran -->
    <div class="debug-top-bar">
      <button id="toggleZoomBtn" class="pill-btn">
        🔍 Vue Complète (Dézoomée)
      </button>
      <button id="restartBtn" class="pill-btn">
        ↺ Reset
      </button>
    </div>

    <!-- Viseur HUD -->
    <div id="hudReticle" class="hud-reticle"></div>

    <!-- Barre d'état bas d'écran -->
    <div class="hud-bar">
      <div id="hudDot" class="hud-status-dot" style="background: #00aaff;"></div>
      <span id="hudText">Ciblez l'artwork sur l'écran PC...</span>
    </div>

    <!-- Écran d'accueil -->
    <div id="startOverlay" style="position: absolute; inset: 0; background: rgba(13,13,14,0.96); z-index: 50; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2rem; text-align: center;">
      <div style="width: 54px; height: 54px; border-radius: 50%; border: 2px solid #00aaff; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; margin-bottom: 1.5rem; box-shadow: 0 0 20px rgba(0,170,255,0.4);">
        🖼️
      </div>
      <h2 style="font-size: 1.3rem; margin-bottom: 0.8rem; color: #fff;">LENTILLE D'ARTWORK</h2>
      <p style="font-size: 0.85rem; color: var(--text-dim); line-height: 1.5; max-width: 320px; margin-bottom: 2rem;">
        Visez l'illustration sur votre écran PC pour transformer la toile en réalité augmentée.
      </p>
      <button id="startBtn" style="background: #00aaff; color: #000; border: none; padding: 0.9rem 2.2rem; font-size: 0.95rem; font-weight: bold; border-radius: 30px; letter-spacing: 0.1em; cursor: pointer; box-shadow: 0 0 20px rgba(0,170,255,0.6);">
        ACTIVER LA CAMÉRA
      </button>
      <div id="permError" style="display: none; color: #ff5555; font-size: 0.78rem; margin-top: 1.5rem; line-height: 1.4; max-width: 300px;"></div>
    </div>

  </div>

  <script>
    const video = document.getElementById('cameraFeed');
    const reticleCanvas = document.getElementById('reticleCanvas');
    const reticleCtx = reticleCanvas.getContext('2d');
    const artLayer = document.getElementById('artReplacementLayer');
    const hudDot = document.getElementById('hudDot');
    const hudText = document.getElementById('hudText');
    const hudReticle = document.getElementById('hudReticle');
    const artSecretCodeDisplay = document.getElementById('artSecretCodeDisplay');
    const startOverlay = document.getElementById('startOverlay');
    const startBtn = document.getElementById('startBtn');
    const permError = document.getElementById('permError');
    const toggleZoomBtn = document.getElementById('toggleZoomBtn');
    const restartBtn = document.getElementById('restartBtn');

    const customSecret = localStorage.getItem('room45_art_secret') || 'RÉPONSE : OUVERTURE';
    artSecretCodeDisplay.textContent = customSecret;

    // Dimensions 1:1 de l'artwork
    const LAYER_W = 540;
    const LAYER_H = 380;
    artLayer.style.width = LAYER_W + 'px';
    artLayer.style.height = LAYER_H + 'px';

    const vision = new Room45Vision(LAYER_W / LAYER_H);
    let isTracking = false;
    let isCoverMode = false;

    toggleZoomBtn.addEventListener('click', () => {
      isCoverMode = !isCoverMode;
      video.classList.toggle('cover-mode', isCoverMode);
      toggleZoomBtn.textContent = isCoverMode ? '🔍 Plein Écran (Cover)' : '🔍 Vue Complète (Dézoomée)';
    });

    restartBtn.addEventListener('click', () => window.location.reload());

    startBtn.addEventListener('click', async () => {
      startBtn.textContent = 'Activation...';
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        startOverlay.style.display = 'none';
        isTracking = true;
        requestAnimationFrame(trackLoop);
      } catch (err) {
        console.error('Camera error:', err);
        permError.style.display = 'block';
        permError.innerHTML = '⚠️ Erreur caméra : ' + err.message;
        startBtn.textContent = 'RÉESSAYER';
      }
    });

    function trackLoop() {
      if (!isTracking) return;

      if (reticleCanvas.width !== window.innerWidth || reticleCanvas.height !== window.innerHeight) {
        reticleCanvas.width = window.innerWidth;
        reticleCanvas.height = window.innerHeight;
      }
      reticleCtx.clearRect(0, 0, reticleCanvas.width, reticleCanvas.height);

      if (video.readyState >= 2 && video.videoWidth > 0) {
        const result = vision.process(video, 480);

        if (result && result.verified) {
          const screenCorners = result.corners.map(pt => videoToScreen(pt.x, pt.y));

          // Dessiner le cadre cyan fin
          reticleCtx.strokeStyle = '#00aaff';
          reticleCtx.lineWidth = 2.5;
          reticleCtx.beginPath();
          reticleCtx.moveTo(screenCorners[0].x, screenCorners[0].y);
          for (let i = 1; i < 4; i++) reticleCtx.lineTo(screenCorners[i].x, screenCorners[i].y);
          reticleCtx.closePath();
          reticleCtx.stroke();

          const matrix3d = vision.getMatrix3d(LAYER_W, LAYER_H, screenCorners);
          if (matrix3d) {
            artLayer.style.transform = matrix3d;
            artLayer.style.display = 'block';
            hudDot.style.background = '#00aaff';
            hudReticle.style.borderColor = '#00aaff';
            hudText.textContent = `TOILE VERROUILLÉE • Remplacement 1:1 (${result.confidence}%)`;
          }

        } else {
          // Hors cible : DISPARITION IMMÉDIATE (Zéro faux positif)
          artLayer.style.display = 'none';
          hudDot.style.background = '#ffaa00';
          hudReticle.style.borderColor = 'rgba(255,255,255,0.25)';
          hudText.textContent = 'Ciblez l\'artwork sur l\'écran PC...';
        }
      }

      requestAnimationFrame(trackLoop);
    }

    function videoToScreen(vx, vy) {
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      const sw = window.innerWidth;
      const sh = window.innerHeight;

      if (!vw || !vh) return { x: vx, y: vy };

      let scale, renderedW, renderedH, offsetX, offsetY;

      if (isCoverMode) {
        scale = Math.max(sw / vw, sh / vh);
        renderedW = vw * scale;
        renderedH = vh * scale;
        offsetX = (sw - renderedW) / 2;
        offsetY = (sh - renderedH) / 2;
      } else {
        scale = Math.min(sw / vw, sh / vh);
        renderedW = vw * scale;
        renderedH = vh * scale;
        offsetX = (sw - renderedW) / 2;
        offsetY = (sh - renderedH) / 2;
      }

      return {
        x: vx * scale + offsetX,
        y: vy * scale + offsetY
      };
    }
  </script>
</body>
</html>
