# ============================================
# Serveur interne (localhost uniquement)
# Pour les appels de Liquidsoap vers les scripts PHP
# ============================================
server {
    listen 127.0.0.1:80;
    server_name localhost;
    
    root /var/www/html;
    index index.php index.html;
    
    # PHP uniquement - pas besoin du reste pour les appels internes
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}

# ============================================
# Serveur principal (HTTPS) — Proxy vers Next.js
# ============================================
server {
    listen 443 ssl http2;
    server_name grandemaisonzoo.com www.grandemaisonzoo.com;

    ssl_certificate /etc/letsencrypt/live/grandemaisonzoo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grandemaisonzoo.com/privkey.pem;

    # Augmentation de la taille maximale d'upload (pour les images PNG/JPG)
    client_max_body_size 20M;

    # Protection contre les attaques automatisées
    include /etc/nginx/snippets/security-rules.conf;

    limit_conn addr 200;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Fichiers uploadés (images des posts, artistes) — servis directement par nginx
    location /uploads/ {
        alias /var/www/html/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Covers de playlists — servis directement par nginx
    location /covers/ {
        alias /var/www/html/covers/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Vidéos — servis directement par nginx (fichiers lourds)
    location /vid/ {
        alias /var/www/html/vid/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Images statiques — servis directement par nginx
    location /images/ {
        alias /var/www/html/images/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Fichiers statiques Next.js — cache long (hashes dans les noms)
    location /_next/static/ {
        alias /var/www/frontend/.next/standalone/.next/static/;
        expires max;
        add_header Cache-Control "public, immutable";
    }

    # Flux Icecast proxifié en HTTPS
    location /stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control no-cache;
    }

    # Proxy pour le statut JSON d'Icecast
    location /status-json.xsl {
        proxy_pass http://127.0.0.1:8000/status-json.xsl;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Cache-Control' 'no-cache';
    }

    # Room45 — site PHP séparé servi directement par PHP-FPM
    location ^~ /room45/ {
        alias /var/www/html/room45/;
        index index.php;
        try_files $uri $uri/ /room45/index.php$is_args$args;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/var/run/php/php-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT /var/www/html/room45;
        }
    }

    location = /room45 {
        return 301 /room45/;
    }

    # Tout le reste → Next.js (port 3000)
    location / {
        limit_req zone=general_limit burst=100 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}