server {
    listen 443 ssl http2;
    server_name grandemaisonzoo.com www.grandemaisonzoo.com;

    ssl_certificate /etc/letsencrypt/live/grandemaisonzoo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grandemaisonzoo.com/privkey.pem;

    # MODIFICATION: 'root' et 'index' ont été déplacés ici.
    # Cela permet à tous les blocs 'location' (y compris PHP) de connaître le bon répertoire.
    root /var/www/html;
    index index.php index.html;

    # Augmentation de la taille maximale d'upload (pour les images PNG/JPG)
    client_max_body_size 20M;

    # Protection contre les attaques automatisées
    include /etc/nginx/snippets/security-rules.conf;

    # Rate limiting pour les requêtes - burst élevé pour les pages avec beaucoup d'images
    # limit_req zone=general_limit burst=100 nodelay; # Moved to specific locations
    limit_conn addr 50;

    # Site web
    location / {
        limit_req zone=general_limit burst=100 nodelay;
        autoindex off; # Sécurité : Interdire le listing des fichiers
        # Try to serve a file with the requested URI, or with .html or .php extension.
        # If not found, try a directory with the requested URI.
        # Finally, if nothing is found, return 404.
        try_files $uri $uri.html $uri.php $uri/ =404;
    }

    # Cache static assets - Sans rate limiting (géré par la zone séparée)
    location ~* \.(?:jpg|jpeg|png|gif|ico|css|js|mjs|woff|woff2|ttf|otf|svg|mp4|jfif|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Uploads - Images des posts
    location /uploads/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Images statiques
    location /images/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # PHP
    location ~ \.php$ {
        limit_req zone=general_limit burst=100 nodelay;
    	include fastcgi_params;
    	fastcgi_pass unix:/var/run/php/php-fpm.sock;
    	fastcgi_index index.php;
    	fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
	}

    # Flux Icecast proxifié en HTTPS
    location /stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control no-cache;
    }

    # Proxy pour le statut JSON d'Icecast
    location /status-json.xsl {
        proxy_pass http://127.0.0.1:8000/status-json.xsl;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Cache-Control' 'no-cache';
    }
}